/* Unit 2 notebook. To change a lesson, edit the words below (keep the quotes and commas). */
NB.render({

  anchor: "<p>A yellow Labrador named Honey and a black Labrador named Bear have a litter of puppies. Some puppies are black. Some are yellow. All of them have floppy ears and webbed toes. Why do offspring look like their parents, but not exactly the same?</p>",

  /* ---------------- Lesson 1 ---------------- */
  {
    title: "Born Knowing How",
    warm: "<p>Honey’s puppies are one day old. Their eyes are still closed. Still, they wiggle across the blanket to find their mother and drink her milk.</p><p>Eight weeks later, one puppy sits when its new owner says “Sit!” and holds up a treat.</p>",

        { t: "reveal", btn: "See the science", a: "<p>Finding milk is an <b>instinct</b>. An instinct is a behavior an animal is born knowing how to do. No one teaches it.</p><p>Sitting when someone says “Sit” is a <b>learned behavior</b>. The puppy learned it from practice and from people. It was not born knowing it.</p>" }
      ]},
      { title: "Sort the behaviors", blocks: [
        { t: "sort", q: "Is each behavior an instinct or a learned behavior?", bins: ["Instinct (born knowing)", "Learned behavior"], items: [

          ["A baby cries when it is hungry", 0, "No one teaches a newborn to cry. Babies are born doing it."],

          ["A chimpanzee uses a stick to catch termites", 1, "Young chimps learn this by watching older chimps and practicing."]

            "Color is a trait, not a behavior. It does not tell you if a behavior was learned.",

  /* ---------------- Lesson 2 ---------------- */
  {
    title: "Passed Down: Inherited Traits",

      ]}

    synth: { idea: "<p><b>Inherited traits</b> are passed from parents to offspring, like eye color or leaf shape. <b>Acquired traits</b> happen during a living thing’s life, like a scar or strong muscles. Acquired traits are not passed down through genetics.</p>",

        done: "These traits were passed down from parents." }
    ]

  /* ---------------- Lesson 3 ---------------- */

          spots: [
            { x: 30, y: 55, ans: "grandparents", hint: "This is the oldest generation, at the top of the chart." },

            { x: 30, y: 250, ans: "offspring", hint: "The puppies are the young of Bear and Honey." }
          ], extra: ["habitat", "instinct"], caption: "Lines down connect parents to their offspring." },
        { t: "table", caption: "Puppies in Honey and Bear’s litters", head: ["Litter", "Black puppies", "Yellow puppies"], rows: [
          ["First litter", 3, 2], ["Second litter", 4, 3], ["Third litter", 2, 4]] },
        { t: "mc", q: "What pattern do you see in the litters?", opts: [
            "Every puppy looks exactly like its mother.",
            "Every litter has both black and yellow puppies, like the two parents.",
            "All the puppies are yellow.",
            "The puppies get no traits from their father."],
          ans: 1, fb: [
            "Many puppies are black, like Bear. They do not all look like Honey.",
            "Each litter has some of each color. The puppies inherit traits from both parents.",
            "The table shows black puppies in every litter.",
            "Black puppies got their coat color from Bear, so the father passes traits too."] }
      ]},
      { title: "Why not exact copies?", blocks: [
        { t: "blanks", text: "Offspring get traits from {both|Think: the mother AND the father.} parents. Traits are passed from one {generation|Grandparents, parents and puppies are each one of these.} to the next. The study of how traits are passed down is called {genetics|It is the science of inherited traits.}.",
          extra: ["one", "habitat", "instinct"] },
        { t: "reveal", q: "Why is one puppy bigger than its brothers and sisters?", btn: "Tap to see", a: "<p>Each puppy gets a different mix of traits from its two parents. That is why brothers and sisters look alike but not exactly the same. How much a puppy eats can also change its size during its life.</p>" }
      ]}
    ],
    synth: { idea: "<p>A <b>pedigree</b> is a family tree that shows traits across generations. Patterns in a pedigree show that traits are passed from parents to offspring. Offspring get traits from both parents, so they look like their parents but are not exact copies.</p>",
      vocab: [
        ["generation", "all the family members born at about the same time; grandparents, parents and children are three generations"],
        ["pedigree", "a family tree chart that shows traits over generations"],
        ["parent", "a living thing that has offspring"],
        ["offspring", "the young of a living thing"],
        ["genetics", "the study of how traits are passed from parents to offspring"]
      ]},
    cool: [
      { t: "mc", q: "In the pedigree, a black grandfather and a yellow grandmother had a black son (Bear). What does this show?", opts: [
          "Bear inherited his coat color from a parent.",
          "Bear chose his own coat color.",
          "Bear’s coat color is an acquired trait.",
          "Coat color is a learned behavior."],
        ans: 0, fb: [
          "Bear’s black coat came from his parents, just like his father.",
          "Animals cannot choose inherited traits like coat color.",
          "Coat color does not happen during life. Bear was born with it.",
          "Coat color is a trait, not a behavior."] }
    ]
  },
  /* ---------------- Lesson 4 ---------------- */
  {
    title: "Plants, People and Good Questions",
    warm: "<p>Two bean seeds come from the same parent plant. One grows on a sunny windowsill. It is tall and green. The other grows in a dark closet. It is pale, thin and floppy.</p>",
    goal: "ask questions to compare inherited traits and acquired traits in plants and people.",
    acts: [
      { title: "Same seeds, different plants", blocks: [
        { t: "text", q: "Why do you think the two bean plants look so different?", ph: "I think…", rows: 2 },
        { t: "reveal", btn: "See the science", a: "<p>Both plants inherited the same kinds of traits from their parent plant, like leaf shape. But the <b>environment</b> matters too. The plant in the dark could not get the sunlight it needs to make food. Its pale, weak look came from its life in the dark, so it is <b>acquired</b>. Its seeds would not grow pale plants in the sun.</p>" },
        { t: "mc", q: "Flamingos hatch with gray feathers. They turn pink from the shrimp and algae they eat. Is a flamingo’s pink color inherited or acquired?", opts: ["Inherited, because all flamingos are born pink", "Acquired, because it comes from what the flamingo eats during its life", "A learned behavior", "An instinct"],
          ans: 1, fb: [
            "Flamingos are not born pink. They hatch gray.",
            "The pink comes from food the flamingo eats during its life.",

            "An instinct is a behavior. Feather color is a trait."] }

      { title: "Traits in people", blocks: [
        { t: "sort", q: "Sort these human traits.", bins: ["Inherited trait", "Acquired trait"], items: [
          ["Natural hair color", 0, "Natural hair color is passed down from parents."],
          ["Dimples", 0, "Dimples are passed down in families."],
          ["The shape of your nose", 0, "Nose shape is passed down from parents."],

          ["A missing tooth from a fall", 1, "The tooth was lost during life. It is not passed down."]

      ]},
      { title: "Ask questions to compare traits", blocks: [
        { t: "multi", q: "Which questions could help you decide if a trait is inherited or acquired?", opts: [

            "What is the living thing’s name?",
            "Do other offspring of the same parents have this trait?",
            "Is it sunny today?"],
          ans: [0, 1, 3], why: ["", "", "A name does not tell you where a trait came from.", "", "Today’s weather does not tell you where a trait came from."],
          done: "Questions about the parents and about the living thing’s life help you compare." },
        { t: "text", q: "Ask your own question that compares an inherited trait and an acquired trait.", ph: "Why… / How…", rows: 2,
          model: "Why are a puppy’s webbed toes passed down from its parents, but a scar on its leg is not?",
          check: "Does your question name one inherited trait and one acquired trait?" }
      ]}
    ],
    synth: { idea: "<p>Living things inherit traits from their parents. The environment and life events can add acquired traits. Questions like “Did the parents have it?” and “Did it happen during its life?” help us compare inherited and acquired traits.</p>",
      vocab: [
        ["inherited trait", "a characteristic passed from parents to offspring"],
        ["acquired trait", "a characteristic a living thing gets during its life"],
        ["characteristic", "a feature of a living thing"],
        ["environment", "everything around a living thing, like sunlight, water, food and weather"]
      ]},
    cool: [
      { t: "mc", q: "Ana’s mother and grandmother have curly hair. Ana has curly hair too. Ana also has a scar on her knee. Which statement is correct?", opts: [

    { t: "mc", q: "Sea turtle hatchlings crawl to the ocean right after they hatch. Why is this an instinct?", opts: [
